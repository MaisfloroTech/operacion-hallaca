<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reta a un amigo · Operación Hallaca</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1033">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --night:#0b1033; --panel:#2c1a5c; --edge:#4a34aa; --yel:#ffcc00; --red:#d63031; --cream:#f4efe1; --wa:#25d366; --wa2:#128c4a; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--night); color:var(--cream); }
  body { display:flex; align-items:center; justify-content:center; padding:24px max(16px, env(safe-area-inset-left)) 24px max(16px, env(safe-area-inset-right)); font-family:'VT323', 'Courier New', monospace; text-align:center; }
  .box { width:100%; max-width:420px; background:var(--panel); border:4px solid var(--edge); padding:28px 20px; }
  h1 { font-family:'Press Start 2P', 'Courier New', monospace; font-size:16px; line-height:1.6; color:var(--yel); text-shadow:3px 3px 0 var(--red); margin:0 0 16px; }
  p { font-size:22px; line-height:1.3; margin:0 0 20px; }
  .btn { display:block; font-family:'Press Start 2P', 'Courier New', monospace; font-size:13px; line-height:1.5; text-decoration:none; padding:16px 12px; margin:0 0 12px; border:0; }
  .wa { background:var(--wa); color:var(--night); border-bottom:5px solid var(--wa2); }
  .alt { background:transparent; color:var(--cream); border:3px solid var(--edge); font-size:11px; }
  .wa:focus-visible, .alt:focus-visible { outline:3px solid var(--yel); outline-offset:3px; }
  small { display:block; font-size:18px; color:#8f96c9; margin-top:6px; }
  .lights { letter-spacing:6px; font-size:14px; margin-bottom:18px; }
  .lights span:nth-child(4n+1){color:#62e8ff} .lights span:nth-child(4n+2){color:#3fae5a} .lights span:nth-child(4n+3){color:var(--yel)} .lights span:nth-child(4n){color:var(--red)}
</style>
</head>
<body>
<main class="box">
  <div class="lights" aria-hidden="true"><span>●</span><span>●</span><span>●</span><span>●</span><span>●</span><span>●</span><span>●</span><span>●</span></div>
  <h1>¡RETA A UN AMIGO!</h1>
  <p id="msg">Abriendo WhatsApp con el mensaje listo…</p>
  <a class="btn wa" id="open" href="https://api.whatsapp.com/send?text=">💬 ABRIR WHATSAPP</a>
  <a class="btn alt" id="web" href="https://web.whatsapp.com/send?text=">Usar WhatsApp Web</a>
  <a class="btn alt" href="/">▶ Ir al juego</a>
  <small>Si no se abrió solo, toca el botón verde.</small>
</main>
<script>
(function () {
  var MSG = '¡Te reto a rescatar la hallaca! 🫔 Juega Operación Hallaca y a ver si me ganas en el scoreboard: https://operacion-hallaca.maisfloro.com';
  var t = encodeURIComponent(MSG);
  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var web = 'https://api.whatsapp.com/send?text=' + t;
  var app;
  if (android) {
    // intent:// abre la app (WhatsApp o WhatsApp Business) y, si no está instalada, cae a la versión web
    app = 'intent://send?text=' + t + '#Intent;scheme=whatsapp;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
  } else if (ios) {
    app = 'whatsapp://send?text=' + t;
  } else {
    app = 'https://wa.me/?text=' + t; // computador: WhatsApp ofrece abrir la app de escritorio o la web
  }
  var open = document.getElementById('open');
  open.href = app;
  document.getElementById('web').href = 'https://web.whatsapp.com/send?text=' + t;
  if (!android && !ios) document.getElementById('msg').textContent = 'Toca el botón para abrir WhatsApp con el mensaje listo.';
  // intento automático en el celular; si el navegador del correo lo bloquea, queda el botón (un toque sí abre la app)
  if (android || ios) {
    setTimeout(function () { window.location.href = app; }, 250);
    if (ios) setTimeout(function () {
      if (!document.hidden) document.getElementById('msg').textContent = 'Toca el botón verde para abrir WhatsApp.';
    }, 1800);
  }
})();
</script>
</body>
</html>
